{% extends "base.html" %}
{% block title %}Авторизация — GenZ Quiz{% endblock %}
{% block body %}
<div class="login-wrap">
    <div class="login-card">
        <h1>GenZ Quiz — Панель управления</h1>
        <p>Введите секретный ключ для входа</p>
        {% if error %}
        <div class="error-msg">Неверный ключ. Попробуйте ещё раз.</div>
        {% endif %}
        <form method="POST" action="/login">
            <input type="password" name="secret" placeholder="Секретный ключ" autofocus required>
            <button type="submit">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
